name: geosurvey
description: "Geo Survey - Offline GIS data collector for land surveying"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0

  # Mapping & Geospatial
  flutter_map: ^8.2.2
  flutter_map_tile_caching: ^10.0.1
  latlong2: ^0.9.1
  turf: ^0.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.6
  path: ^1.9.0

  # Data Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^10.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  screenshot: ^3.0.0
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  http: ^1.2.0
  equatable: ^2.0.7
  xml: ^6.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  riverpod_generator: ^2.6.2
  json_serializable: ^6.8.0
  freezed: ^2.5.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true



flutter:
  uses-material-design: true
  generate: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/

  # Custom Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
