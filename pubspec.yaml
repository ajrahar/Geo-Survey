name: geosurvey
description: "Offline GIS data collection app for land surveying with advanced polygon drawing and geospatial calculations."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0

  # Mapping & Geospatial
  flutter_map: ^8.2.2
  flutter_map_tile_caching: ^10.0.1
  latlong2: ^0.9.1
  turf: ^0.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.9.4
  path_provider: ^2.1.4
  path: ^1.9.0

  # Data Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Utilities
  share_plus: ^10.1.2
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  intl: ^0.19.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  riverpod_generator: ^2.6.2
  json_serializable: ^6.8.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/

  # Custom Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
